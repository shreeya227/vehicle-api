spring:
  datasource:
    url: jdbc:h2:mem:vehicle_titles;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  security:
    api-key: test-api-key
  outbox:
    initial-delay-ms: 3600000
