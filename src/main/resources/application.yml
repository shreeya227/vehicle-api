spring:
  application:
    name: vehicle-title-transaction-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vehicle_titles}
    username: ${DATABASE_USERNAME:vehicle_titles}
    password: ${DATABASE_PASSWORD:vehicle_titles}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  webservices:
    path: /ws

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  security:
    api-key: ${APP_API_KEY:dev-secret-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [correlationId:%X{correlationId:-none}]"
