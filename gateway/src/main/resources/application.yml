spring:
  application:
    name: vehicle-title-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Keep Redis from slowing the edge: if it does not answer quickly, the limiter lets the request through.
      connect-timeout: 500ms
      timeout: 500ms

server:
  port: ${PORT:8000}

gateway:
  vehicle-api-uri: ${VEHICLE_API_URI:http://localhost:8080}
  rate-limit:
    replenish-rate: ${RATE_LIMIT_REPLENISH_RATE:10}
    burst-capacity: ${RATE_LIMIT_BURST_CAPACITY:20}
    requested-tokens: 1

resilience4j:
  circuitbreaker:
    instances:
      vehicleApi:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      vehicleApi:
        timeout-duration: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # The rate limiter lets traffic through when Redis is down, so a Redis outage
    # should not mark the gateway unhealthy and pull it out of rotation.
    redis:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
