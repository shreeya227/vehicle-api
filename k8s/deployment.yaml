apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-title-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vehicle-title-api
  template:
    metadata:
      labels:
        app: vehicle-title-api
    spec:
      containers:
        - name: api
          image: ghcr.io/shreeya227/vehicle-title-transaction-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: vehicle-title-api
            - secretRef:
                name: vehicle-title-api
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

