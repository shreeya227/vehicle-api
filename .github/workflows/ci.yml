name: ci

on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: |
          set -o pipefail
          mvn --batch-mode verify 2>&1 | tee build.log || {
            # Surface the first errors as annotations so they show on the run summary.
            grep -E "^\[ERROR\]" build.log | grep -v "^\[ERROR\] *$" | head -10 | sed 's/^/::error::/'
            exit 1
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-reports
          path: |
            target/surefire-reports
            target/site/jacoco

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateway-test-reports
          path: gateway/target/surefire-reports
